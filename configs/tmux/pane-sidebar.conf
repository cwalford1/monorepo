# Prefix + T: move the selected pane to an 80-column, full-height right sidebar.
# Resolve IDs when pressed, so this works in any session and window.
# Pane 0 is the anchor; selecting it leaves the layout unchanged.
bind-key T if-shell -F '#{!=:#{pane_index},0}' {
    run-shell "tmux -S #{q:socket_path} move-pane -s #{q:pane_id} -t #{q:session_id}:#{q:window_id}.0 -h -f -l 80"
}

# Prefix + H: fold the active pane to 5 columns, or expand it to 80 columns.
bind-key H if-shell -F '#{m/r:^([0-9]|10)$,#{pane_width}}' {
    resize-pane -x 80
} {
    resize-pane -x 5
}
